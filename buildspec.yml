version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies"
      - cd Generative-UI-studio-main
      - npm ci

  pre_build:
    commands:
      - echo "Running lint checks"
      - cd Generative-UI-studio-main
      - npm run lint

  build:
    commands:
      - echo "Building Vite and server bundles"
      - cd Generative-UI-studio-main
      - npm run build

  post_build:
    commands:
      - echo "Build completed"

artifacts:
  files:
    - Generative-UI-studio-main/dist/**
    - Generative-UI-studio-main/dist/server.cjs
    - Generative-UI-studio-main/package.json
    - Generative-UI-studio-main/package-lock.json
    - Generative-UI-studio-main/server.ts
    - Generative-UI-studio-main/vite.config.ts
    - Generative-UI-studio-main/tsconfig.json
    - Generative-UI-studio-main/Dockerfile
    - Generative-UI-studio-main/.dockerignore
    - Generative-UI-studio-main/appspec.yml
    - Generative-UI-studio-main/scripts/**
  discard-paths: no

cache:
  paths:
    - Generative-UI-studio-main/node_modules/**
