version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies with npm ci"
      - npm ci
  pre_build:
    commands:
      - echo "Running TypeScript checks"
      - npm run lint
  build:
    commands:
      - echo "Building the Vite/React application"
      - npm run build
  post_build:
    commands:
      - echo "Build completed successfully"

artifacts:
  files:
    - dist/**/*
    - package.json
    - package-lock.json
    - server.ts
    - vite.config.ts
    - tsconfig.json
    - Dockerfile
    - .dockerignore
    - appspec.yml
    - scripts/**/*
  discard-paths: no

cache:
  paths:
    - node_modules/**
