name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Generative-UI-studio-main/package-lock.json

      - name: Install dependencies
        run: |
          cd Generative-UI-studio-main
          npm ci

      - name: Lint
        run: |
          cd Generative-UI-studio-main
          npm run lint

      - name: Build
        run: |
          cd Generative-UI-studio-main
          npm run build
